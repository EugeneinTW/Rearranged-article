<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rearranged Articles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #FFFFFF; --tint: #F3F5F8; --line: #E5E9EE;
    --ink: #1C2431; --ink-soft: #2B3340; --mute: #6B7380; --faint: #8A93A0;
    --accent: #C8501F; --accent-deep: #9E3E16; --accent-bg: #FCF1EA;
    --green: #2E7B4F; --green-bg: #EEF6F0;
    --font: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); } a:hover { color: var(--accent-deep); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 960px; margin: 0 auto; padding-block: 40px 64px; padding-inline: 24px; }

  .masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 22px; border-bottom: 2px solid var(--ink); }
  .masthead .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  .masthead h1 { margin: 0; font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
  .masthead h1 span { display: block; font-size: 15.5px; font-weight: 400; color: var(--mute); margin-top: 8px; line-height: 1.7; text-wrap: pretty; }
  .masthead .count { font-family: var(--mono); font-size: 13px; color: var(--mute); white-space: nowrap; }
  .masthead .count b { font-weight: 600; color: var(--accent); font-size: 22px; margin-right: 4px; }

  .tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 18px 0 4px; }
  .search { flex: 1 1 260px; min-width: 0; font: inherit; font-size: 15px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--tint); color: var(--ink); }
  .search::placeholder { color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-family: var(--mono); font-size: 12px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--mute); cursor: pointer; }
  .chip span { color: var(--faint); margin-left: 4px; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
  .chip[aria-pressed="true"] span { color: rgba(255, 255, 255, 0.6); }

  .list { list-style: none; margin: 0; padding: 0; }
  .entry { display: grid; grid-template-columns: 124px 1fr; gap: 8px 28px; padding: 28px 0; border-bottom: 1px solid var(--line); }
  .entry .date { font-family: var(--mono); font-size: 13px; color: var(--faint); padding-top: 7px; line-height: 1.5; }
  .entry .date .src { display: block; font-size: 11px; letter-spacing: 0.04em; margin-top: 8px; }
  .entry h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.4; font-weight: 700; text-wrap: pretty; }
  .entry h2 a { color: var(--ink); text-decoration: none; border-bottom: 2px solid transparent; }
  .entry h2 a:hover { color: var(--accent); border-bottom-color: var(--accent-bg); }
  .entry p { margin: 0 0 12px; color: var(--ink-soft); font-size: 15.5px; line-height: 1.75; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--mute); }
  .badge { font-family: var(--mono); font-size: 11.5px; padding: 2px 9px; border-radius: 4px; background: var(--green-bg); color: var(--green); font-weight: 600; }
  .meta .tag { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .meta .tag::before { content: "#"; }
  .extras { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13.5px; }
  .extras a { text-decoration: none; border-bottom: 1px solid var(--accent-bg); }
  .extras a::before { content: "＋ "; color: var(--faint); }
  .empty { padding: 48px 0; color: var(--mute); text-align: center; }

  footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--faint); line-height: 1.8; }
  footer code { font-family: var(--mono); font-size: 12px; background: var(--tint); padding: 1px 6px; border-radius: 4px; color: var(--mute); }

  @media (max-width: 640px) {
    .wrap { padding-block: 28px 48px; padding-inline: 16px; }
    .masthead h1 { font-size: 27px; }
    .entry { grid-template-columns: 1fr; gap: 4px; padding: 22px 0; }
    .entry .date { padding-top: 0; }
    .entry .date .src { display: inline; margin: 0 0 0 10px; }
    .entry h2 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <p class="eyebrow">EugeneinTW · Rearranged Articles</p>
      <h1>整理過的文章<span>把值得讀的技術文章，重新整理成好讀的中文學習版：圖解重點卡加逐章說明，每篇附原文連結。</span></h1>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
  </header>

  <div class="tools">
    <input class="search" id="search" type="search" placeholder="搜尋標題、摘要、標籤、來源" aria-label="搜尋文章">
    <div class="chips" id="chips" role="group" aria-label="依標籤篩選"></div>
  </div>

  <ol class="list" id="list"></ol>

  <footer>
    這裡的文章是學習用的重新整理與圖解，不是原文的逐句翻譯；觀點與著作權屬於原作者，每篇都附原文連結。程式片段為教學用精簡版，實際用法以原文與官方文件為準。
  </footer>
</div>

<script src="articles.js"></script>
<script>
(function () {
  var data = (window.ARTICLES && window.ARTICLES.articles) || [];
  var list = document.getElementById('list');
  var chips = document.getElementById('chips');
  var search = document.getElementById('search');
  var count = document.getElementById('count');
  var activeTag = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var tagCounts = {};
  data.forEach(function (a) { (a.tags || []).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; }); });
  var tags = Object.keys(tagCounts).sort(function (x, y) { return tagCounts[y] - tagCounts[x] || x.localeCompare(y); });

  function renderChips() {
    var out = ['<button type="button" class="chip" data-tag="" aria-pressed="' + (activeTag === null) + '">全部</button>'];
    tags.forEach(function (t) {
      out.push('<button type="button" class="chip" data-tag="' + esc(t) + '" aria-pressed="' + (activeTag === t) + '">' + esc(t) + '<span>' + tagCounts[t] + '</span></button>');
    });
    chips.innerHTML = out.join('');
  }

  function entryHtml(a) {
    var src = '';
    if (a.source && a.source.url) {
      src = '<span>來源：<a href="' + esc(a.source.url) + '">' + esc(a.source.name || a.source.url) + '</a></span>';
    } else if (a.source && a.source.name) {
      src = '<span>來源：' + esc(a.source.name) + '</span>';
    }
    var badges = (a.formats || []).map(function (f) { return '<span class="badge">' + esc(f) + '</span>'; }).join('');
    var tagHtml = (a.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var extras = (a.extras || []).map(function (e) { return '<a href="' + esc(e.path) + '">' + esc(e.label) + '</a>'; }).join('');
    var srcDate = a.source && a.source.date ? '<span class="src">原文 ' + esc(a.source.date) + '</span>' : '';
    return '<li class="entry">' +
      '<div class="date">' + esc(a.date || '') + srcDate + '</div>' +
      '<div>' +
        '<h2><a href="' + esc(a.path) + '">' + esc(a.title) + '</a></h2>' +
        (a.summary ? '<p>' + esc(a.summary) + '</p>' : '') +
        '<div class="meta">' + badges + src + tagHtml + '</div>' +
        (extras ? '<div class="extras">' + extras + '</div>' : '') +
      '</div>' +
    '</li>';
  }

  function render() {
    var q = search.value.trim().toLowerCase();
    var items = data.filter(function (a) {
      if (activeTag && (a.tags || []).indexOf(activeTag) < 0) return false;
      if (!q) return true;
      var hay = [a.title, a.summary, (a.tags || []).join(' '), a.source && a.source.name, (a.formats || []).join(' ')].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
    count.innerHTML = '<b>' + data.length + '</b>篇' + (items.length !== data.length ? ' · 顯示 ' + items.length : '');
    if (!items.length) {
      list.innerHTML = '<li class="empty">' + (data.length ? '沒有符合的文章。' : '還沒有文章。') + '</li>';
      return;
    }
    list.innerHTML = items.map(entryHtml).join('');
  }

  chips.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.chip') : null;
    if (!b) return;
    var t = b.getAttribute('data-tag');
    activeTag = (t && activeTag !== t) ? t : null;
    renderChips();
    render();
  });
  search.addEventListener('input', render);
  renderChips();
  render();
})();
</script>
</body>
</html>
