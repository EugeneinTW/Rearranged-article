name: Build article index

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild articles.js
        run: python build_index.py

      - name: Commit the index if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.js
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "chore: rebuild article index [skip ci]"
            git push
          fi
